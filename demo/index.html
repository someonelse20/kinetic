<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kinetic EKF Demo</title>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: #1a1a2e;
            color: #e0e0e0;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #00d4ff;
            margin-bottom: 30px;
        }
        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        button {
            padding: 12px 24px;
            font-size: 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary {
            background: #00d4ff;
            color: #000;
            font-weight: 600;
        }
        .btn-primary:hover:not(:disabled) {
            background: #00a8cc;
            transform: translateY(-2px);
        }
        .btn-secondary {
            background: #2d2d44;
            color: #fff;
            border: 1px solid #444;
        }
        .btn-secondary:hover:not(:disabled) {
            background: #3d3d5c;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }
        .chart-container {
            background: #16213e;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #0f3460;
        }
        .chart-title {
            font-size: 16px;
            font-weight: 600;
            color: #00d4ff;
            margin-bottom: 12px;
        }
        .legend {
            display: flex;
            gap: 20px;
            margin-top: 10px;
            font-size: 12px;
            flex-wrap: wrap;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 2px;
        }
        .error {
            color: #ff4757;
            text-align: center;
            padding: 15px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧭 Kinetic EKF Demo</h1>
        
        <div class="controls">
            <button class="btn-primary" onclick="runSimulation()">▶️ Run All-Axis Test</button>
            <button class="btn-secondary" onclick="clearCharts()">🔄 Clear</button>
        </div>
        
        <div id="error" class="error"></div>
        
        <div class="chart-container">
            <div class="chart-title">📊 Roll Angle (X-axis)</div>
            <div id="rollChart"></div>
        </div>
        <div class="chart-container">
            <div class="chart-title">📊 Pitch Angle (Y-axis)</div>
            <div id="pitchChart"></div>
        </div>
        <div class="chart-container">
            <div class="chart-title">📊 Yaw Angle (Z-axis)</div>
            <div id="yawChart"></div>
        </div>
    </div>

    <script>
        let ekfData = [];
        let trueData = [];

        async function runSimulation() {
            const btn = document.querySelector('.btn-primary');
            const errorDiv = document.getElementById('error');
            
            btn.disabled = true;
            btn.textContent = '⏳ Running...';
            errorDiv.style.display = 'none';
            
            try {
                const response = await fetch('/demo/api/simulate');
                if (!response.ok) throw new Error('Simulation failed');
                
                const result = await response.json();
                
                if (result.error) throw new Error(result.error);
                
                ekfData = result.ekf;
                trueData = result.true;
                
                plotCharts();
                
            } catch (err) {
                errorDiv.textContent = 'Error: ' + err.message;
                errorDiv.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = '▶️ Run All-Axis Test';
            }
        }

        function plotCharts() {
            const x = Array.from({length: ekfData.length}, (_, i) => i);
            
            // Roll chart
            Plotly.newPlot('rollChart', [
                {x: x, y: ekfData.map(d => d[0]), mode: 'lines', name: 'EKF', line: {color: '#00d4ff'}},
                {x: x, y: trueData.map(d => d[0]), mode: 'lines', name: 'True', line: {color: '#ff6b6b'}}
            ], {margin: {t: 30, b: 30, l: 40, r: 20}, showlegend: true, hovermode: 'x unified', xaxis: {title: 'Step'}, yaxis: {title: 'Roll (rad)'}});
            
            // Pitch chart
            Plotly.newPlot('pitchChart', [
                {x: x, y: ekfData.map(d => d[1]), mode: 'lines', name: 'EKF', line: {color: '#4ecdc4'}},
                {x: x, y: trueData.map(d => d[1]), mode: 'lines', name: 'True', line: {color: '#ffe66d'}}
            ], {margin: {t: 30, b: 30, l: 40, r: 20}, showlegend: true, hovermode: 'x unified', xaxis: {title: 'Step'}, yaxis: {title: 'Pitch (rad)'}});
            
            // Yaw chart
            Plotly.newPlot('yawChart', [
                {x: x, y: ekfData.map(d => d[2]), mode: 'lines', name: 'EKF', line: {color: '#a855f7'}},
                {x: x, y: trueData.map(d => d[2]), mode: 'lines', name: 'True', line: {color: '#ff9f43'}}
            ], {margin: {t: 30, b: 30, l: 40, r: 20}, showlegend: true, hovermode: 'x unified', xaxis: {title: 'Step'}, yaxis: {title: 'Yaw (rad)'}});
        }

        function clearCharts() {
            ekfData = [];
            trueData = [];
            Plotly.Plotly.DeselectData([document.getElementById('eulerChart')]);
            document.getElementById('eulerChart').innerHTML = '';
        }
    </script>
</body>
</html>
