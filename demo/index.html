            background: #00d4ff;

        .btn-primary:hover:not(:disabled) {

        }
        .btn-secondary {
            background: #2d2d44;
            color: #fff;
            border: 1px solid #444;
        }
        .btn-secondary:hover:not(:disabled) {
            background: #3d3d5c;
        }
        .inputs-container {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-bottom: 20px;
            padding: 12px 18px;
            background: #16213e;
            border-radius: 8px;
            border: 1px solid #0f3460;
        }
        .input-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .input-group label {
            font-size: 12px;
            color: #00d4ff;
            font-weight: 500;
        }
        .input-group input {
            width: 65px;
            padding: 6px 8px;
            font-size: 12px;
            border-radius: 4px;
            border: 1px solid #444;
            background: #0d1121;
            color: #fff;
            text-align: center;
        }
        .input-group input:focus {
            outline: none;
            border-color: #00d4ff;
        }
        .input-unit {
            font-size: 10px;
            color: #888;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }
        .chart-container {
            background: #16213e;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #0f3460;
        }
        .chart-title {
            font-size: 16px;
            font-weight: 600;
            color: #00d4ff;
            margin-bottom: 12px;
        }
        .legend {
            display: flex;
            gap: 20px;
            margin-top: 10px;
            font-size: 12px;
            flex-wrap: wrap;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 2px;
        }
        .error {
            color: #ff4757;
            text-align: center;
            padding: 15px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Kinetic EKF Demo</h1>
        
        <div class="controls">
            <button class="btn-primary" onclick="runSimulation()">▶️ Run All-Axis Test</button>
            <button class="btn-secondary" id="linearInterpolationBtn" onclick="runLinearInterpolation()">📐 Linear Interpolation</button>
            <button class="btn-secondary" onclick="clearCharts()">🔄 Clear</button>
        </div>

        <div class="chart-container">
            <div class="chart-title">📊 Roll Angle (X-axis)</div>

    <script>
        let ekfData = [];
        let trueData = [];

        async function runLinearInterpolation() {
            const btn = document.querySelector('#linearInterpolationBtn');
			/*
            const startRot = [
                parseFloat(document.getElementById('startRoll').value),
                parseFloat(document.getElementById('startPitch').value),
                parseFloat(document.getElementById('startYaw').value)
            ];
            const endRot = [
                parseFloat(document.getElementById('endRoll').value),
                parseFloat(document.getElementById('endPitch').value),
                parseFloat(document.getElementById('endYaw').value)
            ];
			*/
			const startRot = [0, 0, 0];
			const endRot = [45, 45, 45];
            const errorDiv = document.getElementById('error');
            
            btn.disabled = true;
            btn.textContent = '⏳ Running...';
            errorDiv.style.display = 'none';
            
            try {
                // Debug logging
                console.log('runLinearInterpolation called');
                console.log('startRot:', startRot);
                console.log('endRot:', endRot);
                
                // Build query string with URL-encoded JSON arrays
                const params = new URLSearchParams();
                params.append('startRot', JSON.stringify(startRot));
                params.append('endRot', JSON.stringify(endRot));
                const queryString = params.toString();
                
                console.log('Query string:', queryString);
                
                const response = await fetch('/demo/api/linear?' + queryString, {
                    method: 'GET'
                });
                if (!response.ok) throw new Error('Simulation failed');
                if (!response.ok) throw new Error('Simulation failed');
                
                const result = await response.json();
                
                if (result.error) throw new Error(result.error);
                
                ekfData = result.ekf;
                trueData = result.true;
                
                plotCharts();
                
            } catch (err) {
                errorDiv.textContent = 'Error: ' + err.message;
                errorDiv.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = '📐 Linear Interpolation';
            }
        }

        // Update runLinearInterpolation to use selected rotation values
        window.runLinearInterpolationConfig = function() {
			/*
            const startRot = [
                parseFloat(document.getElementById('startRoll').value),
                parseFloat(document.getElementById('startPitch').value),
                parseFloat(document.getElementById('startYaw').value)
            ];
            const endRot = [
                parseFloat(document.getElementById('endRoll').value),
                parseFloat(document.getElementById('endPitch').value),
                parseFloat(document.getElementById('endYaw').value)
            ];
			*/
			const startRot = [0, 0, 0];
			const endRot = [45, 45, 45];
            return { startRot, endRot };
        };

        async function runSimulation() {
            const btn = document.querySelector('.btn-primary');
            const errorDiv = document.getElementById('error');
            
            btn.disabled = true;
            btn.textContent = '⏳ Running...';
            errorDiv.style.display = 'none';
            
            try {
                const response = await fetch('/demo/api/simulate');
                if (!response.ok) throw new Error('Simulation failed');
                
                const result = await response.json();
                
                if (result.error) throw new Error(result.error);
                
                ekfData = result.ekf;
                trueData = result.true;
                
                plotCharts();
                
            } catch (err) {
                errorDiv.textContent = 'Error: ' + err.message;
                errorDiv.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = '▶️ Run All-Axis Test';
            }
        }

        function plotCharts() {
            const x = Array.from({length: ekfData.length}, (_, i) => i);
            
            // Roll chart
            Plotly.newPlot('rollChart', [
                {x: x, y: ekfData.map(d => d[0]), mode: 'lines', name: 'EKF', line: {color: '#00d4ff', shape: 'solid'}},
                {x: x, y: trueData.map(d => d[0]), mode: 'lines', name: 'True', line: {color: '#ff6b6b', dash: 'dot'}}
            ], {margin: {t: 30, b: 30, l: 40, r: 20}, showlegend: true, hovermode: 'x unified', xaxis: {title: 'Step'}, yaxis: {title: 'Roll (rad)'}});
            
            // Pitch chart
            Plotly.newPlot('pitchChart', [
                {x: x, y: ekfData.map(d => d[1]), mode: 'lines', name: 'EKF', line: {color: '#4ecdc4', shape: 'solid'}},
                {x: x, y: trueData.map(d => d[1]), mode: 'lines', name: 'True', line: {color: '#ffe66d', dash: 'dot'}}
            ], {margin: {t: 30, b: 30, l: 40, r: 20}, showlegend: true, hovermode: 'x unified', xaxis: {title: 'Step'}, yaxis: {title: 'Pitch (rad)'}});
            
            // Yaw chart
            Plotly.newPlot('yawChart', [
                {x: x, y: ekfData.map(d => d[2]), mode: 'lines', name: 'EKF', line: {color: '#a855f7', shape: 'solid'}},
                {x: x, y: trueData.map(d => d[2]), mode: 'lines', name: 'True', line: {color: '#ff9f43', dash: 'dot'}}
            ], {margin: {t: 30, b: 30, l: 40, r: 20}, showlegend: true, hovermode: 'x unified', xaxis: {title: 'Step'}, yaxis: {title: 'Yaw (rad)'}});
        }

        function clearCharts() {
            Plotly.purge('rollChart');
            Plotly.purge('pitchChart');
            Plotly.purge('yawChart');
        }
    </script>
</body>
