<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kinetic EKF Demo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "SF Mono", "Menlo", "Monaco", "Consolas", monospace;
    background: #0d1117; color: #c9d1d9; line-height: 1.5;
  }
  .header {
    padding: 16px 24px; background: #161b22; border-bottom: 1px solid #30363d;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  .header h1 { font-size: 18px; font-weight: 600; }
  .status-dot {
    width: 10px; height: 10px; border-radius: 50%; background: #30363d;
    margin-right: 8px; display: inline-block;
  }
  .status-dot.ready { background: #3fb950; }
  .status-dot.running { background: #f2994a; animation: pulse 1.5s infinite; }
  .status-dot.stopped { background: #da3633; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

  .controls { display: flex; gap: 8px; margin-left: auto; }
  button {
    padding: 8px 16px; border: none; border-radius: 6px;
    font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer;
    background: #238636; color: #ffffff; transition: background 0.15s;
  }
  button:hover { background: #2ea043; }
  button:disabled { background: #30363d; cursor: not-allowed; opacity: 0.6; }
  button.secondary { background: #21262d; }
  button.secondary:hover { background: #30363d; }

  .main { display: grid; grid-template-columns: 1fr 320px; gap: 16px; padding: 16px; }
  .charts { display: grid; grid-template-rows: auto auto auto; gap: 12px; }
  .panel {
    background: #0d1117; border: 1px solid #30363d; border-radius: 8px;
    padding: 12px; position: relative; overflow: hidden;
  }
  .panel h2 {
    font-size: 12px; font-weight: 600; color: #8b949e; text-transform: uppercase;
    letter-spacing: 0.1em; margin-bottom: 8px; border-bottom: 1px solid #30363d;
    padding-bottom: 6px;
  }
  .chart-container {
    height: 160px; position: relative; overflow: hidden;
  }
  .chart-container canvas { width: 100%; height: 100%; }
  .chart-label {
    position: absolute; bottom: 4px; left: 8px; font-size: 10px; color: #8b949e;
    background: rgba(13,17,23,0.8); padding: 2px 6px; border-radius: 4px;
  }
  .sidebar { display: flex; flex-direction: column; gap: 12px; }
  .data-row {
    display: flex; justify-content: space-between; gap: 12px;
    padding: 6px 0; border-bottom: 1px solid #21262d; font-size: 12px;
  }
  .data-label { color: #8b949e; }
  .data-value { font-family: inherit; font-weight: 500; }
  .data-value.highlight { color: #58a6ff; }
  .data-value.error { color: #f85149; }
  .data-value.success { color: #3fb950; }

  .legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 11px; }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-color {
    width: 10px; height: 10px; border-radius: 2px;
  }

  @media (max-width: 900px) {
    .main { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="header">
  <div>
    <span class="status-dot ready" id="statusDot"></span>
    <span id="statusText">Initializing...</span>
  </div>
  <h1>kinetic EKF Demo</h1>
  <div class="controls">
    <button id="btnStart">Start</button>
    <button id="btnPause" class="secondary" disabled>Pause</button>
    <button id="btnReset" class="secondary">Reset</button>
  </div>
</div>

<div class="main">
  <div class="charts">
    <div class="panel">
      <h2>Roll (X)</h2>
      <div class="chart-container">
        <canvas id="rollCanvas"></canvas>
        <span class="chart-label">Roll Angle</span>
      </div>
    </div>
    <div class="panel">
      <h2>Pitch (Y)</h2>
      <div class="chart-container">
        <canvas id="pitchCanvas"></canvas>
        <span class="chart-label">Pitch Angle</span>
      </div>
    </div>
    <div class="panel">
      <h2>Yaw (Z)</h2>
      <div class="chart-container">
        <canvas id="yawCanvas"></canvas>
        <span class="chart-label">Yaw Angle</span>
      </div>
    </div>
  </div>

  <div class="sidebar">
    <div class="panel">
      <h2>Current State</h2>
      <div class="data-row">
        <span class="data-label">Quaternion (x,y,z,w)</span>
        <span class="data-value" id="quatVal">--</span>
      </div>
      <div class="data-row">
        <span class="data-label">Euler (roll,pitch,yaw)</span>
        <span class="data-value" id="eulerVal">--</span>
      </div>
    </div>

    <div class="panel">
      <h2>Covariance</h2>
      <div class="data-row">
        <span class="data-label">Σ[0]</span>
        <span class="data-value" id="cov0">--</span>
      </div>
      <div class="data-row">
        <span class="data-label">Σ[1]</span>
        <span class="data-value" id="cov1">--</span>
      </div>
      <div class="data-row">
        <span class="data-label">Σ[2]</span>
        <span class="data-value" id="cov2">--</span>
      </div>
      <div class="data-row">
        <span class="data-label">Σ[3]</span>
        <span class="data-value" id="cov3">--</span>
      </div>
    </div>

    <div class="panel">
      <h2>Legend</h2>
      <div class="legend">
        <div class="legend-item">
          <span class="legend-color" style="background:#f2994a"></span>
          <span>EKF estimate</span>
        </div>
        <div class="legend-item">
          <span class="legend-color" style="background:#3fb950"></span>
          <span>True value</span>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// --- Chart.js Setup ---
const ctxRoll = document.getElementById('rollCanvas').getContext('2d');
const ctxPitch = document.getElementById('pitchCanvas').getContext('2d');
const ctxYaw = document.getElementById('yawCanvas').getContext('2d');

const chartRoll = new Chart(ctxRoll, {
  type: 'line',
  data: { datasets: [{ label: 'EKF', data: [] }, { label: 'True', data: [] }] },
  options: {
    responsive: true, maintainAspectRatio: false,
    scales: { x: { display: false }, y: { grid: { color: '#30363d' } } },
    plugins: { legend: { display: false }, tooltip: { mode: 'index', intersect: false } },
    animation: { duration: 0 }
  }
});

const chartPitch = new Chart(ctxPitch, {
  type: 'line',
  data: { datasets: [{ label: 'EKF', data: [] }, { label: 'True', data: [] }] },
  options: {
    responsive: true, maintainAspectRatio: false,
    scales: { x: { display: false }, y: { grid: { color: '#30363d' } } },
    plugins: { legend: { display: false }, tooltip: { mode: 'index', intersect: false } },
    animation: { duration: 0 }
  }
});

const chartYaw = new Chart(ctxYaw, {
  type: 'line',
  data: { datasets: [{ label: 'EKF', data: [] }, { label: 'True', data: [] }] },
  options: {
    responsive: true, maintainAspectRatio: false,
    scales: { x: { display: false }, y: { grid: { color: '#30363d' } } },
    plugins: { legend: { display: false }, tooltip: { mode: 'index', intersect: false } },
    animation: { duration: 0 }
  }
});

// --- State ---
let isConnected = false;
let isRunning = false;
let isPaused = false;
let lastUpdate = 0;
const updateRate = 200; // ms between updates

// --- Connection ---
const socket = new WebSocket('ws://127.0.0.1:8082/data');

socket.onopen = () => {
  isConnected = true;
  setStatus('running');
};

socket.onmessage = (event) => {
  const now = Date.now();
  if (now - lastUpdate < updateRate) return;
  lastUpdate = now;

  try {
    const data = JSON.parse(event.data);
    updateUI(data);
  } catch (e) {
    console.error('Failed to parse EKF data:', e);
  }
};

socket.onclose = () => {
  isConnected = false;
  setStatus('ready');
};

socket.onerror = (err) => {
  console.error('WebSocket error:', err);
  setStatus('ready');
};

// --- UI Updates ---
function setStatus(state) {
  const dot = document.getElementById('statusDot');
  const text = document.getElementById('statusText');
  dot.className = 'status-dot ' + state;
  text.textContent = state === 'running' ? 'Running...' :
                     state === 'ready' ? 'Ready' : 'Stopped';
}

function updateUI(data) {
  // Update current state display
  document.getElementById('quatVal').textContent =
    `[${data.quat.join(', ')}]`;
  document.getElementById('eulerVal').textContent =
    `[${data.euler.join(', ')}]`;
  document.getElementById('cov0').textContent = data.covariance[0];
  document.getElementById('cov1').textContent = data.covariance[1];
  document.getElementById('cov2').textContent = data.covariance[2];
  document.getElementById('cov3').textContent = data.covariance[3];

  // Update charts
  const now = new Date(data.step).getTime();

  chartRoll.data.datasets[0].data.push({ x: data.step, y: data.euler[0] });
  chartRoll.data.datasets[1].data.push({ x: data.step, y: data.euler_true[0] });
  chartPitch.data.datasets[0].data.push({ x: data.step, y: data.euler[1] });
  chartPitch.data.datasets[1].data.push({ x: data.step, y: data.euler_true[1] });
  chartYaw.data.datasets[0].data.push({ x: data.step, y: data.euler[2] });
  chartYaw.data.datasets[1].data.push({ x: data.step, y: data.euler_true[2] });

  // Keep arrays size manageable (show last 200 points)
  chartRoll.data.datasets[0].data.shift();
  chartRoll.data.datasets[1].data.shift();
  chartPitch.data.datasets[0].data.shift();
  chartPitch.data.datasets[1].data.shift();
  chartYaw.data.datasets[0].data.shift();
  chartYaw.data.datasets[1].data.shift();

  chartRoll.update();
  chartPitch.update();
  chartYaw.update();
}

// --- Controls ---
document.getElementById('btnStart').addEventListener('click', () => {
  if (!isConnected) return;
  isRunning = true;
  isPaused = false;
  setStatus('running');
  document.getElementById('btnStart').disabled = true;
  document.getElementById('btnPause').disabled = false;
});

document.getElementById('btnPause').addEventListener('click', () => {
  if (!isConnected) return;
  isPaused = true;
  setStatus('stopped');
  document.getElementById('btnPause').textContent = 'Resume';
  document.getElementById('btnStart').disabled = false;
});

document.getElementById('btnReset').addEventListener('click', () => {
  if (!isConnected) return;
  isRunning = false;
  isPaused = false;
  setStatus('ready');
  document.getElementById('btnStart').disabled = false;
  document.getElementById('btnPause').disabled = true;
  document.getElementById('btnPause').textContent = 'Pause';

  // Reset chart data
  chartRoll.data.datasets[0].data = [];
  chartRoll.data.datasets[1].data = [];
  chartPitch.data.datasets[0].data = [];
  chartPitch.data.datasets[1].data = [];
  chartYaw.data.datasets[0].data = [];
  chartYaw.data.datasets[1].data = [];
  chartRoll.update();
  chartPitch.update();
  chartYaw.update();
});

// --- Auto-connect ---
window.addEventListener('DOMContentLoaded', () => {
  if (typeof WebSocket !== 'undefined') {
    // Already handled above
  } else {
    document.getElementById('statusText').textContent = 'WebSocket not supported';
  }
});
</script>

</body>
</html>
